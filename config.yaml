# Span-based NER Model Configuration
train_file: 'data/train.txt'
dev_file: 'data/dev.txt'
test_file: 'data/test.txt'
output_file: 'result/submission.txt'
work_dir: 'result' # Base work directory for intermediate files, models, logs
device: 'cuda' # 'cuda' or 'cpu'
seed: 2025

# Model & Training Hyperparameters (Span-based NER)
model_name: "hfl/chinese-macbert-base_adapted_ep2_seed2025"  # BERT模型
model_type: "span"                # 明确使用span模型
freeze_bert: false                # 不冻结BERT参数
hidden_dropout_prob: 0.1          # BERT隐藏层dropout
attention_probs_dropout_prob: 0.1 # BERT注意力dropout
batch_size: 16                   # 适合8GB显存
learning_rate: 2e-5              # BERT学习率
num_epochs: 20                   # 增加训练轮数，从15提升到20
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
gradient_accumulation_steps: 1

# Sequence Length Settings
max_sequence_length: 384         # 为8GB显存优化

# Optimized Span Model Configuration
use_biaffine: true               # Use biaffine attention for span classification
biaffine_hidden_dim: 256         # Biaffine attention hidden dimension
span_threshold: 0.2              # 进一步降低span预测置信度阈值，从0.3降低到0.2，提高召回率
span_dropout: 0.05               # 降低span classifier dropout，从0.1降低到0.05
span_loss_weight: 1.0            # Weight for span loss
early_stopping_patience: 10      # 增加early stopping耐心，从8提升到10
min_delta: 0.001

# Advanced Span Matrix Optimization
use_sparse_spans: false          # 关闭稀疏span表示，使用标准密集矩阵
enable_intelligent_filtering: true # 启用智能span过滤
enable_linguistic_constraints: true # 启用基于中文地址的语言学约束
dynamic_max_span_length: true   # 动态调整最大span长度
span_efficiency_mode: 'balanced' # 效率模式: 'memory', 'speed', 'balanced'

# Advanced Hybrid Loss Configuration - 调整损失权重以提高精确率
use_focal_loss: true
focal_weight: 0.9                # 从0.8提升到0.9，更强调难样本
focal_loss_alpha: 0.4            # 从0.3提升到0.4，进一步减少易分类样本（负样本）的损失权重
focal_loss_gamma: 3.0            # 从2.0提升到3.0，更强烈地关注困难样本
label_smoothing: 0.03            # 从0.05降低到0.03，减少过度正则化

# Regularization
spatial_dropout: 0.2
embedding_dropout: 0.1

# Stochastic Weight Averaging (SWA)
use_swa: true
swa_start_epoch: 10              # 从0调整到10，在后期进行权重平均
swa_lr: 1e-5
swa_freq: 2

# Adversarial Training (FreeLB)
use_freelb: true # Set to true to enable FreeLB adversarial training
adversarial_training_start_epoch: 4  # 从3提升到4，让模型先稳定训练
freelb_adv_lr: 0.03              # 从0.05降低到0.03，更温和的扰动
freelb_adv_steps: 3
freelb_adv_init_mag: 0.03        # 从0.05降低到0.03
freelb_adv_max_norm: 0.05        # 从0.07降低到0.05
freelb_adv_norm_type: "l2"
freelb_base_model: "bert" # Part of the model to apply perturbations

# Labeling Schema (BIOES format for span conversion)
label_map:
  labels:
    - 'prov'
    - 'city'
    - 'district'
    - 'devzone'
    - 'town'
    - 'community'
    - 'village_group'
    - 'road'
    - 'roadno'
    - 'poi'
    - 'subpoi'
    - 'houseno'
    - 'cellno'
    - 'floorno'
    - 'roomno'
    - 'detail'
    - 'assist'
    - 'distance'
    - 'intersection'
    - 'redundant'
    - 'others'
  type: 'BIOES'

# K-Fold Cross-Validation
use_kfold: false
k_folds: 5

# Training Optimization Settings
dataloader_num_workers: 0        # Windows compatibility, set to 0
pin_memory: true                 # Fixed memory for accelerated GPU transfer

# Model Saving and Checkpointing
save_steps: 1000                  # Save model every how many steps
save_total_limit: 3              # Maximum number of checkpoints to save
load_best_model_at_end: true     # Load best model at the end of training
evaluation_strategy: 'epoch'     # Evaluation strategy
save_strategy: 'epoch'           # Save strategy

# Logging Settings
logging_steps: 100                # Log recording steps
report_to: []                    # Do not use external logging service

# Performance Settings
use_fp16: false                  # Whether to use mixed precision training
use_gradient_checkpointing: false # Whether to use gradient checkpointing

# Inference Configuration  
inference_batch_size: 16         # Batch size for inference
max_predict_length: 384          # Maximum sequence length for inference

# Optimizer Configuration
optimizer_type: "adamw"
scheduler_type: "linear_warmup"
adam_epsilon: 1e-8
adam_beta1: 0.9
adam_beta2: 0.999

# Logging Level
log_level: "INFO"
eval_steps: 500

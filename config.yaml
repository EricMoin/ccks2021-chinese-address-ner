# Span-based NER Model Configuration
train_file: 'data/train.conll'
dev_file: 'data/dev.conll'
test_file: 'data/final_test.txt' # Original test file for submission processing
output_file: 'result/submission.txt'
work_dir: 'result' # Base work directory for intermediate files, models, logs
device: 'cuda' # 'cuda' or 'cpu'
seed: 2025

# Model & Training Hyperparameters (Span-based NER)
model_name: 'pretrained/hfl_chinese-roberta-wwm-ext_adapted_ep2_seed2025' # Default model for training
model_type: 'span' # Model type (always 'span' for this implementation)
batch_size: 16
num_epochs: 15
learning_rate: 3.0e-5
weight_decay: 0.01
freeze_bert_layers: 0

# Sequence Length Settings
max_sequence_length: 384  # Optimized for span model and 8GB VRAM

# Span Model Configuration
use_biaffine: true               # Use biaffine attention for span classification
biaffine_hidden_dim: 512         # Biaffine attention hidden dimension
span_threshold: 0.1              # Span prediction confidence threshold
span_dropout: 0.1                # Span classifier dropout
span_loss_type: 'combined'       # Span loss function type: 'focal', 'combined', 'ce'
span_loss_weight: 1.0            # Weight for span loss
early_stopping_patience: 5       # Early stopping patience value

# Loss Function & Regularization
focal_loss_alpha: 0.25
focal_loss_gamma: 2.0
spatial_dropout: 0.2
embedding_dropout: 0.1

# Stochastic Weight Averaging (SWA)
use_swa: true
swa_start_epoch: 5
swa_lr: 1.0e-5
swa_freq: 2

# Adversarial Training (FreeLB)
use_freelb: true # Set to true to enable FreeLB adversarial training
adversarial_training_start_epoch: 3 # Epoch to start FreeLB (0-indexed)
freelb_adv_lr: 0.05 # Adversarial learning rate
freelb_adv_steps: 3 # Number of adversarial steps
freelb_adv_init_mag: 0.05 # Initial perturbation magnitude
freelb_adv_max_norm: 0.07 # Max norm of the perturbation
freelb_adv_norm_type: 'l2' # Norm type for perturbation ('l2' or 'linf')
freelb_base_model: 'bert' # Part of the model to apply perturbations

# Labeling Schema (BIOES format for span conversion)
label_map:
  labels:
    - 'prov'
    - 'city'
    - 'district'
    - 'devzone'
    - 'town'
    - 'community'
    - 'village_group'
    - 'road'
    - 'roadno'
    - 'poi'
    - 'subpoi'
    - 'houseno'
    - 'cellno'
    - 'floorno'
    - 'roomno'
    - 'detail'
    - 'assist'
    - 'distance'
    - 'intersection'
    - 'redundant'
    - 'others'
  type: 'BIOES'

# K-Fold Cross-Validation
k_folds: 5

# Training Optimization Settings
gradient_accumulation_steps: 1    # Gradient accumulation steps
max_grad_norm: 1.0               # Gradient clipping maximum norm
warmup_ratio: 0.1                # Warmup ratio
dataloader_num_workers: 0        # Windows compatibility, set to 0
pin_memory: true                 # Fixed memory for accelerated GPU transfer

# Model Saving and Checkpointing
save_steps: 500                  # Save model every how many steps
save_total_limit: 0              # Maximum number of checkpoints to save
load_best_model_at_end: true     # Load best model at the end of training
evaluation_strategy: 'epoch'     # Evaluation strategy
save_strategy: 'epoch'           # Save strategy

# Logging Settings
logging_steps: 50                # Log recording steps
report_to: []                    # Do not use external logging service

# Performance Settings
use_fp16: false                  # Whether to use mixed precision training
use_gradient_checkpointing: false # Whether to use gradient checkpointing

# Inference Configuration  
inference_batch_size: 16         # Batch size for inference
max_predict_length: 384          # Maximum sequence length for inference

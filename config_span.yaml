# General Settings
train_file: 'data/train.conll'
dev_file: 'data/dev.conll'
test_file: 'data/final_test.txt'
output_file: 'result/span_biaffine_submission.txt'
work_dir: 'result_span'
device: 'cuda'
seed: 2025

# Model & Training Hyperparameters
model_name: 'pretrained/hfl_chinese-roberta-wwm-ext_adapted_ep2_seed2025'
model_type: 'hybrid'  # 'sequence', 'span', 'hybrid'
batch_size: 16
num_epochs: 15
learning_rate: 3.0e-5
weight_decay: 0.01
freeze_bert_layers: 0

# Span-based and Biaffine Configuration
use_biaffine: true
span_threshold: 0.5
sequence_loss_weight: 0.4  # Weight for sequence labeling loss in hybrid model
span_loss_weight: 0.6      # Weight for span-based loss in hybrid model
biaffine_hidden_dim: 512   # Hidden dimension for biaffine attention
span_dropout: 0.1          # Dropout rate for span classifier
span_loss_type: 'combined' # Loss function type: 'focal', 'dice', 'boundary', 'label_smoothing', 'combined', 'ce'

# Loss Function & Regularization
crf_transition_penalty: 0.175
focal_loss_alpha: 0.25
focal_loss_gamma: 2.0
hybrid_loss_weight_crf: 0.5
hybrid_loss_weight_focal: 0.5
spatial_dropout: 0.2
embedding_dropout: 0.1

# Stochastic Weight Averaging (SWA)
use_swa: true
swa_start_epoch: 0
swa_lr: 1.0e-5
swa_freq: 2

# Adversarial Training
use_freelb: true
adversarial_training_start_epoch: 3
freelb_adv_lr: 0.05
freelb_adv_steps: 3
freelb_adv_init_mag: 0.05
freelb_adv_max_norm: 0.07
freelb_adv_norm_type: 'l2'
freelb_base_model: 'bert'

# Labeling Schema
label_map:
  labels:
    - 'prov'
    - 'city'
    - 'district'
    - 'devzone'
    - 'town'
    - 'community'
    - 'village_group'
    - 'road'
    - 'roadno'
    - 'poi'
    - 'subpoi'
    - 'houseno'
    - 'cellno'
    - 'floorno'
    - 'roomno'
    - 'detail'
    - 'assist'
    - 'distance'
    - 'intersection'
    - 'redundant'
    - 'others'
  type: 'BIOES'

# K-Fold Cross-Validation
k_folds: 5 